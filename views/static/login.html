<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Joelmo Auth Systems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../public/css/global.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-logo">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 2L29 9V23L16 30L3 23V9L16 2Z" fill="#15616D" />
                <path d="M11 20L16 12L21 20H11Z" fill="#FFFFFF" />
            </svg>
            <span>Joelmo</span>
        </div>

        <div class="auth-card">
            <h2>Login in</h2>
            <p class="auth-subtitle">Enter your credentials to access your account</p>

            <div class="social-grid">
                <button type="button" class="btn-social" title="Continue with Google" aria-label="Continue with Google">
                    A <!-- Google SVG icon -->
                </button>
                <button type="button" class="btn-social" title="Continue with Apple" aria-label="Continue with Apple">
                   A <!-- Apple SVG icon -->
                </button>
                <button type="button" class="btn-social" title="Continue with Microsoft" aria-label="Continue with Microsoft">
                    A <!-- Microsoft SVG icon -->
                </button>
                <button type="button" class="btn-social" title="Continue with GitHub" aria-label="Continue with GitHub">
                    A <!-- Github SVG icon -->
                </button>
                <button type="button" class="btn-social" title="Continue with Discord" aria-label="Continue with Discord">
                    A <!-- Discord SVG icon -->
                </button>
                <button type="button" class="btn-social" title="Continue with X" aria-label="Continue with X">
                    A <!-- X SVG icon -->
                </button>
            </div>

            <div class="auth-divider">or continue with email</div>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="example@company.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>

                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="#" style="font-size: 13px;">Forgot your password?</a>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="#">Create an account</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
