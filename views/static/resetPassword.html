<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Joelmo Auth Systems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/public/css/global.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 2L29 9V23L16 30L3 23V9L16 2Z" fill="#15616D"/>
                <path d="M11 20L16 12L21 20H11Z" fill="#FFFFFF"/>
            </svg>
            <span>Joelmo</span>
        </div>

        <div class="auth-card">
            <a href="login.html" class="auth-back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                Back to login
            </a>

            <div class="otp-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>

            <h2>Set a new password</h2>
            <p class="auth-subtitle">Your new password must be different from previously used passwords</p>

            <form>
                <div class="mb-3">
                    <label for="password" class="form-label">New password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" placeholder="Enter new password">
                        <button type="button" class="input-icon-btn" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-segment is-strong"></div>
                        <div class="strength-segment is-strong"></div>
                        <div class="strength-segment is-strong"></div>
                        <div class="strength-segment"></div>
                    </div>
                    <p class="strength-label">Strong password</p>
                </div>

                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Confirm new password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="confirm-password" placeholder="Repeat new password">
                        <button type="button" class="input-icon-btn" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p class="form-hint">Use at least 8 characters, including a number and a symbol</p>
                </div>

                <button type="submit" class="btn btn-primary">Reset password</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        // Visual-only: toggle password visibility
        document.querySelectorAll('.input-icon-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = btn.previousElementSibling;
                input.type = input.type === 'password' ? 'text' : 'password';
            });
        });
    </script>
</body>

</html>
