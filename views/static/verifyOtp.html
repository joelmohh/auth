<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - Joelmo Auth Systems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../public/css/global.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 2L29 9V23L16 30L3 23V9L16 2Z" fill="#15616D"/>
                <path d="M11 20L16 12L21 20H11Z" fill="#FFFFFF"/>
            </svg>
            <span>Joelmo</span>
        </div>

        <div class="auth-card">
            <a href="#" class="auth-back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                Back to login
            </a>

            <div class="otp-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>

            <h2>Verify your identity</h2>
            <p class="auth-subtitle">
                Enter the 6-digit code from your authenticator app, or the one we sent to
                <span class="otp-destination">j***@joelmo.dev</span>
            </p>

            <form>
                <div class="otp-inputs">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="form-control otp-digit" autocomplete="one-time-code">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="form-control otp-digit">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="form-control otp-digit">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="form-control otp-digit">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="form-control otp-digit">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="form-control otp-digit">
                </div>

                <p class="otp-error">The code you entered is incorrect. Please try again.</p>

                <button type="submit" class="btn btn-primary">Verify code</button>
            </form>

            <p class="otp-resend">
                Didn't receive a code? <a href="#">Resend</a>
                <span class="otp-timer">&middot; available in 0:28</span>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        // Visual-only UX: auto-advance / backspace between OTP boxes
        const digits = document.querySelectorAll('.otp-digit');
        digits.forEach((input, i) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9]/g, '');
                if (input.value && i < digits.length - 1) digits[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && i > 0) digits[i - 1].focus();
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, digits.length);
                pasted.split('').forEach((char, idx) => { if (digits[idx]) digits[idx].value = char; });
                digits[Math.min(pasted.length, digits.length - 1)].focus();
            });
        });
    </script>
</body>

</html>
